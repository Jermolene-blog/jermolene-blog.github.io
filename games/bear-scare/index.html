function tap(e){if(e.target.closest('#btns'))return;if(state==='start'){begin();return}initAudio();const x=e.clientX/innerWidth;if(x<.45)choose('L');else if(x>.55)choose('R')}
addEventListener('pointerdown',tap);
addEventListener('gesturestart',e=>e.preventDefault());addEventListener('dblclick',e=>e.preventDefault());addEventListener('contextmenu',e=>e.preventDefault());
const DBG={'1':()=>jumpScare('monster'),'2':()=>jumpScare('ghost'),'3':()=>jumpScare('witch'),'4':()=>jumpScare('bats'),'5':quake,'6':()=>ambient('spider'),'7':()=>ambient('witchT'),'8':()=>ambient('eyes'),'9':()=>ambient('ghost'),'0':()=>ambient('scurry')};
addEventListener('keydown',e=>{if(state==='start'&&(e.key===' '||e.key==='Enter')){begin();return}if(e.key==='ArrowLeft'||e.key==='a')choose('L');else if(e.key==='ArrowRight'||e.key==='d')choose('R');else if(e.key==='m')toggleMute();else if(e.key==='r')reset();else if(DBG[e.key]&&state!=='start'){initAudio();DBG[e.key]()}});
function toggleMute(){muted=!muted;LS.muted=muted;save();if(master)master.gain.value=muted?0:.9;$('mw').style.display=muted?'none':'';$('mx').style.display=muted?'':'none'}
function reset(){newGame();state='walk';$('aL').className='arrow';$('aR').className='arrow';events.push({s:s+4,fn:()=>ambient('spider')})}
$('bMute').addEventListener('click',()=>{initAudio();toggleMute()});$('bReset').addEventListener('click',()=>{initAudio();reset()});
if(muted){$('mw').style.display='none';$('mx').style.display=''}
document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():ac.resume()});
let toastT;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2500)}
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();for(const f of e.dataTransfer.files){const buf=await f.arrayBuffer();
  if(/\.(glb|gltf)$/i.test(f.name))new GLTFLoader().parse(buf,'',useBear,err=>{console.warn(err);toast('That bear model did not load')});
  else{initAudio();const k=(f.name.toLowerCase().match(/^[a-z]+/)||[''])[0];if(!(k in CONFIG.SAMPLES)){toast('Name sounds like moan1.m4a, roar.wav…');continue}try{const d=await ac.decodeAudioData(buf);(BUF[k]=BUF[k]||[]).push(d);toast(`Added ${k} sound`)}catch(er){toast('Could not read '+f.name)}}}});

/* prewarm shaders so the first scare doesn't stutter */
newGame();
const warm=[makeMonster(),makeGhost(1),makeWitch(),makeBat(),makeSpider(1),makeHoney()];warm.forEach((m,i)=>{m.g.position.set(bearPos.x+i*.3-.8,1,bearPos.z+1.5);scene.add(m.g)});
const ptsWarm=new THREE.Points(new THREE.BufferGeometry().setFromPoints([new V3(0,1,1)]),new THREE.PointsMaterial({size:.01}));scene.add(ptsWarm);
camera.position.set(0,CAM_H,-5);camera.lookAt(0,1,0);renderer.compile(scene,camera);renderer.render(scene,camera);
warm.forEach(m=>disposeObj(m.g));disposeObj(ptsWarm);
frame();
window.__bs={choose,jumpScare,quake,ambient,get state(){return state}};
</script>
</body>
</html>
