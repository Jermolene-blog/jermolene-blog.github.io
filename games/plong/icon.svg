<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="9" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
<rect y="5" width="8" height="2" fill="#000" opacity="0.28"/>
</pattern>
</defs>
<rect width="512" height="512" fill="#000"/>
<!-- A hexagonal arena, each side a player's goal line, faint -->
<polygon points="256,72 415,164 415,348 256,440 97,348 97,164" fill="none" stroke="#e9f2ee" stroke-width="5" stroke-dasharray="14 12" opacity="0.4"/>
<g filter="url(#glow)" stroke="#e9f2ee" stroke-linecap="square" fill="none">
<!-- Paddles part way along four of the sides -->
<line x1="166" y1="124" x2="222" y2="92" stroke-width="20"/>
<line x1="415" y1="214" x2="415" y2="290" stroke-width="20"/>
<line x1="300" y1="415" x2="356" y2="383" stroke-width="20"/>
<line x1="97" y1="236" x2="97" y2="312" stroke-width="20"/>
</g>
<!-- The ball and its trail -->
<g filter="url(#glow)" fill="#e9f2ee">
<rect x="268" y="230" width="34" height="34"/>
<rect x="226" y="262" width="22" height="22" opacity="0.45"/>
<rect x="194" y="288" width="14" height="14" opacity="0.22"/>
</g>
<rect width="512" height="512" fill="url(#scan)"/>
</svg>
